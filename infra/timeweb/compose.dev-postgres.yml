# Development ONLY; do not use this on production Timeweb.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proidu_dev
      POSTGRES_PASSWORD: local-dev-only-not-production
      POSTGRES_DB: proidu_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - proidu_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proidu_dev -d proidu_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  proidu_local_pg:
